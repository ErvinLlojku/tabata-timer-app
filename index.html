<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Work/Rest Interval Timer</title>
<style>
  :root{
    --bg:#1B1230;
    --surface:#241A3D;
    --surface2:#2E2153;
    --work:#FF8A5B;
    --work-soft:#4a2f2a;
    --rest:#7FD8BE;
    --rest-soft:#233b38;
    --text:#F5F1FF;
    --muted:#A69CC7;
    --ring-track:#33254f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(circle at 50% -10%, var(--surface) 0%, var(--bg) 55%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    transition:background 0.6s ease;
  }
  body.phase-work{
    background:radial-gradient(circle at 50% -10%, #3a2036 0%, #2b1420 55%, #1B1230 100%);
  }
  body.phase-rest{
    background:radial-gradient(circle at 50% -10%, #17323a 0%, #12262c 55%, #1B1230 100%);
  }
  .card{
    width:100%;
    max-width:400px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:6px;
    font-weight:600;
  }
  h1{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:26px;
    text-align:center;
    margin:0 0 28px;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  /* ---- Setup screen ---- */
  .setup{display:flex;flex-direction:column;gap:16px;}
  .field{
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:14px 16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .field-label{display:flex;flex-direction:column;gap:2px;}
  .field-label .name{font-size:14px;font-weight:600;color:var(--text);}
  .field-label .hint{font-size:12px;color:var(--muted);}
  .stepper{display:flex;align-items:center;gap:14px;}
  .stepper button{
    width:32px;height:32px;border-radius:10px;border:none;
    background:var(--surface2);
    color:var(--text);
    font-size:18px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
  }
  .stepper button:active{transform:scale(0.9);}
  .stepper .val{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:20px;
    font-weight:600;
    min-width:52px;
    text-align:center;
  }
  .est{
    text-align:center;
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .primary-btn{
    margin-top:12px;
    width:100%;
    padding:16px;
    border-radius:16px;
    border:none;
    background:linear-gradient(135deg, var(--work), #ff6a3d);
    color:#1B1230;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px;
    font-weight:700;
    letter-spacing:0.01em;
    cursor:pointer;
    box-shadow:0 8px 24px -8px rgba(255,138,91,0.6);
  }
  .primary-btn:active{transform:scale(0.98);}

  /* ---- Run screen ---- */
  .run{display:none;flex-direction:column;align-items:center;}
  .phase-pill{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:6px 16px;
    border-radius:999px;
    margin-bottom:22px;
    transition:background .3s ease, color .3s ease;
  }
  .phase-pill.work{background:var(--work-soft);color:var(--work);}
  .phase-pill.rest{background:var(--rest-soft);color:var(--rest);}

  .ring-wrap{position:relative;width:260px;height:260px;margin-bottom:22px;}
  .ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);}
  .ring-track{fill:none;stroke:var(--ring-track);stroke-width:12;}
  .ring-progress{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke .3s ease;}
  .ring-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .time{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:56px;
    font-weight:700;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .round-label{
    font-size:13px;
    color:var(--muted);
    margin-top:6px;
    font-weight:500;
  }

  .dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:280px;margin-bottom:26px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ring-track);transition:background .25s ease, transform .25s ease;}
  .dot.done{background:var(--muted);}
  .dot.current{background:var(--work);transform:scale(1.3);}

  .controls{display:flex;gap:12px;width:100%;}
  .controls button{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  #pauseBtn{background:var(--surface2);color:var(--text);}
  #resetBtn{background:transparent;color:var(--muted);border:1px solid rgba(255,255,255,0.12);}

  .done-screen{display:none;flex-direction:column;align-items:center;text-align:center;}
  .done-screen .big{font-size:44px;margin-bottom:6px;}
  .done-screen h2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;margin:0 0 8px;font-size:22px;}
  .done-screen p{color:var(--muted);margin:0 0 24px;font-size:14px;}
</style>
</head>
<body>

<div class="card">
  <div class="eyebrow">Interval Timer</div>
  <h1>Work / Rest Sets</h1>

  <div class="setup" id="setupScreen">
    <div class="field">
      <div class="field-label">
        <span class="name">Work</span>
        <span class="hint">high effort interval</span>
      </div>
      <div class="stepper">
        <button type="button" onclick="adjust('work',-5)">-</button>
        <span class="val" id="workVal">45s</span>
        <button type="button" onclick="adjust('work',5)">+</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">
        <span class="name">Rest</span>
        <span class="hint">recovery interval</span>
      </div>
      <div class="stepper">
        <button type="button" onclick="adjust('rest',-5)">-</button>
        <span class="val" id="restVal">15s</span>
        <button type="button" onclick="adjust('rest',5)">+</button>
      </div>
    </div>

    <div class="field">
      <div class="field-label">
        <span class="name">Rounds</span>
        <span class="hint">work + rest repeats</span>
      </div>
      <div class="stepper">
        <button type="button" onclick="adjust('rounds',-1)">-</button>
        <span class="val" id="roundsVal">8</span>
        <button type="button" onclick="adjust('rounds',1)">+</button>
      </div>
    </div>

    <div class="est" id="estimate">Total time: 8:00</div>

    <button class="primary-btn" onclick="startWorkout()">Start</button>
  </div>

  <div class="run" id="runScreen">
    <div class="phase-pill work" id="phasePill">Work</div>

    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="88"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88" stroke="#FF8A5B"></circle>
      </svg>
      <div class="ring-center">
        <div class="time" id="timeDisplay">0:45</div>
        <div class="round-label" id="roundLabel">Round 1 of 8</div>
      </div>
    </div>

    <div class="dots" id="dots"></div>

    <div class="controls">
      <button id="pauseBtn" onclick="togglePause()">Pause</button>
      <button id="resetBtn" onclick="resetWorkout()">End</button>
    </div>
  </div>

  <div class="done-screen" id="doneScreen">
    <div class="big">✓</div>
    <h2>Workout complete</h2>
    <p id="doneSummary">8 rounds done</p>
    <button class="primary-btn" onclick="resetWorkout()">Start another</button>
  </div>
</div>

<script>
const settings = { work: 45, rest: 15, rounds: 8 };
const MIN = { work: 5, rest: 5, rounds: 1 };
const MAX = { work: 600, rest: 300, rounds: 50 };

function adjust(key, delta) {
  let v = settings[key] + delta;
  v = Math.max(MIN[key], Math.min(MAX[key], v));
  settings[key] = v;
  document.getElementById(key + 'Val').textContent = key === 'rounds' ? v : v + 's';
  updateEstimate();
}

function updateEstimate() {
  const totalSec = (settings.work + settings.rest) * settings.rounds - settings.rest;
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  document.getElementById('estimate').textContent = 'Total time: ' + m + ':' + String(s).padStart(2, '0');
}
updateEstimate();

// ---- Audio ----
let audioCtx;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function beep(freq, duration, volume = 0.2, delay = 0) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + duration);
}
function tickBeep() { beep(880, 0.08, 0.15); }
function phaseChangeBeep(toWork) {
  if (toWork) { beep(660, 0.12, 0.25); beep(880, 0.14, 0.25, 0.14); }
  else { beep(520, 0.16, 0.22); }
}
function finishBeep() {
  beep(660, 0.12, 0.25, 0);
  beep(780, 0.12, 0.25, 0.15);
  beep(990, 0.2, 0.28, 0.3);
}
function vibrate(pattern) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

// ---- Timer state ----
let state = {
  phase: 'work',
  round: 1,
  totalRounds: 8,
  running: false,
  phaseEndTs: 0,
  remainingMs: 0,
  rafId: null,
  lastTickSecond: null
};

const RING_CIRC = 2 * Math.PI * 88;

function showScreen(name) {
  document.getElementById('setupScreen').style.display = name === 'setup' ? 'flex' : 'none';
  document.getElementById('runScreen').style.display = name === 'run' ? 'flex' : 'none';
  document.getElementById('doneScreen').style.display = name === 'done' ? 'flex' : 'none';
}

function buildDots() {
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  for (let i = 1; i <= settings.rounds; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot-' + i;
    wrap.appendChild(d);
  }
}

function updateDots() {
  for (let i = 1; i <= settings.rounds; i++) {
    const d = document.getElementById('dot-' + i);
    if (!d) continue;
    d.className = 'dot' + (i < state.round ? ' done' : i === state.round ? ' current' : '');
  }
}

function startWorkout() {
  ensureAudio();
  state.phase = 'work';
  state.round = 1;
  state.totalRounds = settings.rounds;
  buildDots();
  showScreen('run');
  setPhaseUI();
  beginPhase(settings.work * 1000, true);
}

function setPhaseUI() {
  const pill = document.getElementById('phasePill');
  const ring = document.getElementById('ringProgress');
  if (state.phase === 'work') {
    pill.textContent = 'Work';
    pill.className = 'phase-pill work';
    ring.setAttribute('stroke', 'var(--work)');
    document.body.className = 'phase-work';
  } else {
    pill.textContent = 'Rest';
    pill.className = 'phase-pill rest';
    ring.setAttribute('stroke', 'var(--rest)');
    document.body.className = 'phase-rest';
  }
  document.getElementById('roundLabel').textContent = 'Round ' + state.round + ' of ' + state.totalRounds;
  updateDots();
}

function beginPhase(durationMs, playSound) {
  state.remainingMs = durationMs;
  state.phaseEndTs = performance.now() + durationMs;
  state.running = true;
  state.lastTickSecond = Math.ceil(durationMs / 1000);
  document.getElementById('pauseBtn').textContent = 'Pause';
  if (playSound) phaseChangeBeep(state.phase === 'work');
  if (state.rafId) cancelAnimationFrame(state.rafId);
  tickLoop();
}

function tickLoop() {
  if (!state.running) return;
  const now = performance.now();
  const remaining = state.phaseEndTs - now;
  const remSec = Math.max(0, remaining / 1000);
  renderTime(remSec);

  const wholeSec = Math.ceil(remSec);
  if (wholeSec !== state.lastTickSecond) {
    state.lastTickSecond = wholeSec;
    if (wholeSec > 0 && wholeSec <= 3) {
      tickBeep();
      vibrate(30);
    }
  }

  if (remaining <= 0) {
    advancePhase();
    return;
  }
  state.rafId = requestAnimationFrame(tickLoop);
}

function renderTime(remSec) {
  const display = Math.ceil(remSec);
  const m = Math.floor(display / 60);
  const s = display % 60;
  document.getElementById('timeDisplay').textContent = m + ':' + String(s).padStart(2, '0');

  const total = (state.phase === 'work' ? settings.work : settings.rest) * 1000;
  const frac = Math.max(0, Math.min(1, remSec * 1000 / total));
  const offset = RING_CIRC * (1 - frac);
  const ring = document.getElementById('ringProgress');
  ring.setAttribute('stroke-dasharray', RING_CIRC);
  ring.setAttribute('stroke-dashoffset', offset);
}

function advancePhase() {
  if (state.phase === 'work') {
    if (settings.rest > 0) {
      state.phase = 'rest';
      setPhaseUI();
      beginPhase(settings.rest * 1000, true);
    } else {
      nextRoundOrFinish();
    }
  } else {
    nextRoundOrFinish();
  }
}

function nextRoundOrFinish() {
  if (state.round >= state.totalRounds) {
    finishWorkout();
  } else {
    state.round += 1;
    state.phase = 'work';
    setPhaseUI();
    beginPhase(settings.work * 1000, true);
  }
}

function finishWorkout() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  finishBeep();
  vibrate([60, 60, 60, 60, 120]);
  document.body.className = '';
  document.getElementById('doneSummary').textContent = state.totalRounds + ' rounds done';
  showScreen('done');
}

function togglePause() {
  if (state.running) {
    state.running = false;
    state.remainingMs = state.phaseEndTs - performance.now();
    if (state.rafId) cancelAnimationFrame(state.rafId);
    document.getElementById('pauseBtn').textContent = 'Resume';
  } else {
    state.phaseEndTs = performance.now() + state.remainingMs;
    state.running = true;
    document.getElementById('pauseBtn').textContent = 'Pause';
    tickLoop();
  }
}

function resetWorkout() {
  state.running = false;
  if (state.rafId) cancelAnimationFrame(state.rafId);
  document.body.className = '';
  showScreen('setup');
}
</script>

</body>
</html>
